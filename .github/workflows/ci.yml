name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Valores fictícios: o build não acessa o banco.
          MONGODB_URI: mongodb://127.0.0.1:27017/ci
          NEXTAUTH_SECRET: ci-secret
      # Depois do build, que gera o next-env.d.ts
      - run: npm run type-check
